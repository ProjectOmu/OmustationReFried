name: Update Contrib and Patreons in credits
concurrency: commit_action
on:
  workflow_dispatch:
  schedule:
  - cron: 0 0 * * *

env:
#  BOT_TOKEN: ${{ secrets.BOT_TOKEN }} later
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PR_NUMBER: ${{ github.event.number }}

jobs:
  get_credits:
    runs-on: ubuntu-latest
    # Hey there fork dev! If you like to include your own contributors in this then you can probably just change this to your own repo
    # Do this in dump_github_contributors.ps1 too into your own repo
    if: github.repository == 'ProjectOmu/OmustationReFried' && github.event.pull_request.merged == true
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v7
      with:
        ref: master

    - name: Setup Git
        run: |
          git config --global user.name "${{ vars.CHANGELOG_USER }}"
          git config --global user.email "${{ vars.CHANGELOG_EMAIL }}"
        shell: bash

    - name: Get this week's Contributors
      shell: pwsh
      env:
#        BOT_TOKEN: ${{ secrets.BOT_TOKEN }} later
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: Tools/dump_github_contributors.ps1 > ${{ vars.CREDITS_FILE }}

      - name: Commit credits
        run: |
          git add ${{ vars.CREDITS_FILE }}
          git commit -m "${{ vars.CREDITS_MESSAGE }} (#${{ env.PR_NUMBER }})"
          git push
        shell: bash
